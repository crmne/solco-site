<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solco OG image</title>
<style>
  /* The hero in miniature: the site's own fonts, colours, glow and type. */
  @font-face { font-family: "Bricolage Grotesque"; src: url(../site/assets/fonts/BricolageGrotesque.woff2) format("woff2"); font-weight: 200 800; }
  @font-face { font-family: Geist; src: url(../site/assets/fonts/Geist-Regular.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: Geist; src: url(../site/assets/fonts/Geist-SemiBold.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: "Geist Mono"; src: url(../site/assets/fonts/GeistMono-Regular.woff2) format("woff2"); }
  :root { --bg: #0a0b0d; --ink: #eceae6; --ink-3: #82858c; --line: #1d2025; --violet: #b9a3ff; --violet-ink: #17122b;
          --c-blue: #6f81fa; --c-violet: #b9a3ff; --c-orange: #ff8a4c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; color: var(--ink); font-family: Geist, sans-serif; -webkit-font-smoothing: antialiased;
    background: radial-gradient(50% 55% at 82% 4%, rgba(185,163,255,.20), transparent 70%),
                radial-gradient(40% 45% at 0% 70%, rgba(240,154,76,.13), transparent 70%), var(--bg); }
  .top { position: absolute; left: 72px; right: 72px; top: 44px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; font-family: "Bricolage Grotesque"; font-weight: 650; font-size: 32px; letter-spacing: -.035em; font-variation-settings: "opsz" 40; }
  .brand svg { width: 38px; height: 38px; color: var(--violet); }
  .brand b { color: var(--violet); font-weight: inherit; }
  .cta { font-size: 17px; font-weight: 600; padding: 11px 20px; border-radius: 999px; background: var(--violet); color: var(--violet-ink);
    box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset, 0 10px 30px -10px rgba(185,163,255,.7); }
  .kicker { position: absolute; left: 74px; top: 126px; font-family: "Geist Mono"; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  h1 { position: absolute; left: 70px; top: 162px; font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 104px; line-height: .86; letter-spacing: -.05em; font-variation-settings: "opsz" 96; }
  h1 span { display: block; }
  .dot { display: inline-block; width: .17em; height: .17em; border-radius: 50%; background: var(--violet); margin-left: .04em; }
  .steps { position: absolute; left: 72px; top: 362px; font-family: "Bricolage Grotesque"; font-weight: 700; font-size: 33px; letter-spacing: -.03em; font-variation-settings: "opsz" 60; }
  .steps .scale { background: linear-gradient(90deg, var(--c-blue), var(--c-violet) 48%, var(--c-orange) 92%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .09em; margin-right: -.09em; }
  .deck { position: absolute; left: 0; right: 0; bottom: 0; height: 176px; border-top: 1px solid #33373e; background: rgba(12, 13, 15, 0.6); }
  canvas { position: absolute; left: 0; bottom: 0; width: 1200px; height: 176px; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="20" cy="20" r="18.5" stroke-width="1.8"/><circle cx="20" cy="20" r="13.5" stroke-opacity=".55" stroke-width="1.5"/><circle cx="20" cy="20" r="8.5" stroke-opacity=".3" stroke-width="1.5"/><circle cx="20" cy="20" r="3.2" fill="currentColor" stroke="none"/></svg><span>solco<b>.</b></span></div>
    <div class="cta">Request access · getsolco.com</div>
  </div>
  <p class="kicker">DJ library app · Private alpha</p>
  <h1><span>Stop preparing</span><span>your tracks<i class="dot"></i></span></h1>
  <p class="steps">Download them. Drop them in Solco. Find them <span class="scale">on stage</span>.</p>
  <div class="deck"><canvas id="wave" width="2400" height="352"></canvas></div>
<script src="../site/assets/js/data.js"></script>
<script>
  // The hero's deck in miniature: Solco's own waveform of a real track (Glad To Know You,
  // from the page's data), drawn by the app's rules (Solco ADRs 0252, 0257, 0261): blue lows,
  // an orange body and a cream core, with hairline beats and red downbeats over it.
  const d = window.SOLCO.deck;
  const canvas = document.getElementById('wave');
  const g = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, mid = Math.round(H / 2 + 8), half = mid - 22;
  const gain = Math.pow(10, Math.min(6, -9 - d.lufs) / 20);
  const span = 6.6, t0 = d.at - span / 2, n = d.zoom.length, rate = n / d.window, z0 = d.at - d.window / 2;
  const layers = c => { const e = [c[1], c[2], c[3]].map(x => Math.pow(Math.max(0, x), 1.45)), s = e[0] + e[1] + e[2] || 1;
    return [.44 + .56 * Math.sqrt(e[0] / s), .18 + .58 * Math.sqrt(e[1] / s), .03 + .29 * Math.sqrt(e[2] / s)]; };
  const colors = ['#1857e8', '#f48918', '#f6e5cd'];
  for (let x = 0; x < W; x += 2) {
    const c = d.zoom[Math.floor((t0 + x / W * span - z0) * rate)]; if (!c) continue;
    const base = Math.pow(Math.min(1, c[0] * gain), .62) * half, fr = layers(c);
    for (let i = 0; i < 3; i++) { const h = Math.round(base * fr[i]); g.fillStyle = colors[i]; g.fillRect(x, mid - h, 2, h * 2); }
  }
  // Beatgrid: every beat a faint hairline, every bar the downbeat's red, from the track's own grid.
  for (const [t, beat] of d.beats) {
    const x = Math.round((t - t0) / span * W); if (x < 0 || x > W) continue;
    g.fillStyle = beat === 1 ? 'rgba(238, 55, 73, 0.68)' : 'rgba(169, 171, 176, 0.28)';
    g.fillRect(x, 16, 2, H - 16);
  }
  // Playhead, in the deck's green.
  g.fillStyle = '#4cc38a';
  g.fillRect(W / 2 - 2, 0, 4, H);
  g.beginPath(); g.arc(W / 2, 12, 8, 0, 7); g.fill();
</script>
</body>
</html>
