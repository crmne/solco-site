name: Publish getsolco.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Check help center links
        run: ruby script/check_help_links.rb
      - name: Check titles, descriptions, structured data and the sitemap
        run: ruby script/check_seo.rb
      - name: Check headline assignment and analytics exclusions
        run: ruby script/check_hook_test.rb
      - uses: actions/configure-pages@v6
      - name: Plan IndexNow submission
        run: ruby .github/scripts/indexnow.rb plan site "$RUNNER_TEMP/indexnow.json"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Submit changed URLs to IndexNow
        run: ruby .github/scripts/indexnow.rb submit "$RUNNER_TEMP/indexnow.json"
